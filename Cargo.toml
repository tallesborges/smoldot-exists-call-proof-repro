[package]
name = "smoldot-exists-call-proof-repro"
version = "0.1.0"
edition = "2024"
publish = false
description = "smoldot-light fails runtime calls that use storage::exists on a hashed trie value: the call proof has the hash, not the value"

[features]
default = ["smoldot-light-3"]
# Exactly one of these.
smoldot-light-3 = ["dep:smoldot-light-3", "dep:smoldot-5"]
smoldot-light-2 = ["dep:smoldot-light-2", "dep:smoldot-4"]

[dependencies]
smoldot-light-3 = { package = "smoldot-light", version = "=3.0.0", default-features = false, features = ["std"], optional = true }
smoldot-5 = { package = "smoldot", version = "=5.0.0", default-features = false, features = ["std"], optional = true }
smoldot-light-2 = { package = "smoldot-light", version = "=2.1.0", default-features = false, features = ["std"], optional = true }
smoldot-4 = { package = "smoldot", version = "=4.0.0", default-features = false, features = ["std"], optional = true }
env_logger = "0.11"
event-listener = "5"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", features = ["io"] }
hex = "0.4"
log = "0.4"
pin-project = "1"
rand = "0.8"
serde_json = "1"
smol = "2"
ureq = { version = "3", features = ["json"] }
webpki-roots = "1"

# The runtime runs in smoldot's Wasm interpreter, which is slow without optimizations.
[profile.dev.package."*"]
opt-level = 3
